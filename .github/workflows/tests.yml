name: Тесты и выкладка сайта

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # Сайт выкладывается только если все тесты зелёные
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Собрать папку сайта
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest icon-*.png _site/
          cp -r assets scripts styles _site/
          printf '%s\n' "${GITHUB_SHA}" > _site/version.txt
          sed -i "s/name=\"luna-build\" content=\"development\"/name=\"luna-build\" content=\"${GITHUB_SHA}\"/" _site/index.html
          [ -d .well-known ] && cp -r .well-known _site/ || true
          ls _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
