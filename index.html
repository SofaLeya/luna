<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120a12">
<meta name="color-scheme" content="dark">
<title>Луна</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0d080d; --bg2:#170e17; --card:#1d121d; --card2:#251726; --line:#3a2539;
  --tx:#f3e6ef; --mut:#a98ea2; --dim:#6d5868;
  --rose:#ff6fa8; --rose2:#c2477c; --plum:#8e4fd6; --ok:#59d39a; --warn:#ffc35a; --bad:#ff5a6a;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,#3a1430 0%,var(--bg) 60%) fixed;padding-bottom:84px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;color-scheme:dark}
textarea{min-height:70px;resize:vertical}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
header h1{margin:0;font-size:24px;letter-spacing:.5px}
header h1 span{color:var(--rose)}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:20px}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--mut);font-weight:600}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.alert.warn{background:#3a2a10;border:1px solid #6b4d14}
.alert.bad{background:#3d1018;border:1px solid #7a2232}
.alert.info{background:#22163a;border:1px solid #42306b}
.alert b{display:block;margin-bottom:3px}
.alert .row{margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.btn.main{background:linear-gradient(135deg,var(--rose),var(--plum));border:0;color:#fff;font-size:18px;padding:15px 20px;width:100%;box-shadow:0 6px 24px #ff6fa833}
.btn.done{background:#163327;border:1px solid #2b6b4c;color:var(--ok);width:100%;font-size:17px;padding:14px}
.btn.small{padding:7px 12px;font-size:14px;border-radius:11px}
.btn.full{width:100%}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)} .dim{color:var(--dim)} .sm{font-size:14px}
.ring-box{display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:240px;height:240px}
.ring svg{width:100%;height:100%}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:48px;font-weight:800;line-height:1}
.ring .of{color:var(--mut);font-size:14px;margin-top:4px}
.ring .ph{margin-top:8px;font-size:14px;padding:4px 10px;border-radius:20px;background:#ffffff10}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--mut)}
.kv .v{text-align:right;font-weight:600}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:20px;background:var(--bg2);border:1px solid var(--line);font-size:14px}
.chip.on{background:#4a1a35;border-color:var(--rose);color:#fff}
.flow-1.on{background:#3b2030} .flow-2.on{background:#5a1f3a} .flow-3.on{background:#7a1f43} .flow-4.on{background:#9b1840}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#120a12ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .in{display:flex;max-width:520px;width:100%}
nav.tabs button{flex:1;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--dim)}
nav.tabs button .e{font-size:22px;filter:grayscale(1) opacity(.6)}
nav.tabs button.on{color:var(--rose)}
nav.tabs button.on .e{filter:none}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head b{font-size:18px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:12px;color:var(--dim);padding-bottom:2px}
.d{position:relative;aspect-ratio:1/1.12;border-radius:12px;background:var(--bg2);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;font-size:15px}
.d.out{opacity:.25}
.d.today{border-color:#fff}
.d.pred{border:1.5px dashed var(--rose)}
.d.inact{background:#1a161c}
.d.f1{background:#3b2030} .d.f2{background:#5a1f3a} .d.f3{background:#7a1f43} .d.f4{background:#9b1840}
.d .mk{position:absolute;bottom:4px;font-size:10px;line-height:1}
.d .mk.ok{color:var(--ok)} .d .mk.miss{color:var(--bad)} .d .mk.pl{color:var(--dim)}
.d .sy{position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:var(--card);border-top-left-radius:22px;border-top-right-radius:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:8px 18px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0;animation:up .2s}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 12px;font-size:20px}
.sheet h4{margin:16px 0 8px;font-size:14px;color:var(--mut);font-weight:600}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fd{from{opacity:0}}
label.f{display:block;margin:12px 0 5px;font-size:14px;color:var(--mut)}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-size:14px}
.seg button.on{background:var(--card2);color:var(--rose);font-weight:700}
.ep{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.ep:first-child{border-top:0}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#ffffff12;color:var(--mut);margin-left:6px}
.tag.br{background:#5a1f3a;color:#ffc1da}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:var(--bg2);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--mut)}
.help{font-size:14px;line-height:1.5}
.help p{margin:6px 0}
.help ul{margin:6px 0;padding-left:20px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2b1b2b;border:1px solid var(--line);padding:10px 16px;border-radius:14px;z-index:30;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px #0008}
.toast button{color:var(--rose);font-weight:700}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs"><div class="in">
  <button data-tab="today" class="on"><span class="e">🌙</span>Сегодня</button>
  <button data-tab="cal"><span class="e">📅</span>Календарь</button>
  <button data-tab="stats"><span class="e">📊</span>История</button>
</div></nav>

<script>
/* ---------- данные ---------- */
const KEY='luna-v1';
const FLOW=['нет','мажется','слабо','средне','обильно'];
const SYM=['Боль внизу живота','Голова','Грудь','Вздутие','Тошнота','Настроение вниз','Раздражительность','Усталость','Акне','Отёки','Тяга к сладкому'];
const PRESETS=[
  {id:'21p7',name:'21 + 7 плацебо',active:21,inactive:7,type:'placebo',hint:'Ярина Плюс, Джес Плюс и др.'},
  {id:'21b7',name:'21 + 7 перерыв',active:21,inactive:7,type:'break',hint:'Ярина, Регулон и др. - 7 дней без таблеток'},
  {id:'24p4',name:'24 + 4 плацебо',active:24,inactive:4,type:'placebo',hint:'Джес, Модэлль Тренд и др.'},
  {id:'26p2',name:'26 + 2 плацебо',active:26,inactive:2,type:'placebo',hint:'Клайра и др.'},
  {id:'cont',name:'Без перерыва',active:28,inactive:0,type:'placebo',hint:'пью активные подряд'}
];
let S=load();
function def(){return{v:1,setup:false,since:null,mode:'pill',pill:{name:'Ярина Плюс',preset:'21p7',active:21,inactive:7,type:'placebo',time:'21:00',packs:[],stock:null},taken:{},days:{}}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);return Object.assign(def(),o,{pill:Object.assign(def().pill,o.pill||{})})}}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Не получилось сохранить в браузере - сделай копию в настройках')}}

/* ---------- даты ---------- */
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const add=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const today=()=>key(new Date());
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const fmt=k=>{const d=parse(k);return d.getDate()+' '+MON[d.getMonth()]};
const fmtW=k=>fmt(k)+', '+WD[parse(k).getDay()];
const fmtShort=k=>{const d=parse(k);return d.getDate()+'.'+pad(d.getMonth()+1)};
function plural(n,a,b,c){n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m==1)return a;return c}

/* ---------- логика пачки ---------- */
const P=()=>S.pill;
const L=()=>P().active+P().inactive;
function packInfo(k){
  if(S.mode!=='pill'||!P().packs.length)return null;
  const ps=[...P().packs].sort();
  let st=null;for(const p of ps)if(p<=k)st=p;
  if(!st)return null;
  const n=diff(st,k),len=L(),kk=Math.floor(n/len),vs=add(st,kk*len),day=n%len+1;
  // если следующая реальная пачка начата раньше - эта виртуальная обрезается
  return{day,len,start:vs,end:add(vs,len-1),active:day<=P().active,inIdx:day-P().active,virtual:kk>0};
}
function schedAt(k){const[h,m]=P().time.split(':').map(Number);const d=parse(k);d.setHours(h,m,0,0);return d}
function lateH(k){const t=S.taken[k];if(!t)return null;return (new Date(t.at)-schedAt(k))/36e5}
function predBleed(k){
  if(S.mode==='pill'){
    const pi=packInfo(k);if(!pi||P().inactive<1)return false;
    return !pi.active&&pi.inIdx>=2&&pi.inIdx<=Math.min(P().inactive,6);
  }
  const n=natural();if(!n.next)return false;
  const d=diff(n.next,k);return d>=0&&d<n.len;
}
function nextPack(k){const pi=packInfo(k);return pi?add(pi.end,1):null}
function nextBleedStart(k){
  if(S.mode!=='pill')return natural().next;
  for(let i=0;i<70;i++){const x=add(k,i);if(predBleed(x)&&!predBleed(add(x,-1)))return x}
  return null;
}
function missedActive(){
  // пропущенные активные таблетки в текущей и прошлой пачке (до вчера), не раньше первой пачки
  const t=today(),out=[];
  for(let i=1;i<=35;i++){const k=add(t,-i);if(S.since&&k<S.since)break;const pi=packInfo(k);if(!pi)break;if(pi.active&&!S.taken[k])out.push(k)}
  return out.reverse();
}

/* ---------- эпизоды кровотечений ---------- */
function episodes(){
  const ks=Object.keys(S.days).filter(k=>(S.days[k].flow||0)>0).sort();
  const eps=[];let cur=null;
  for(const k of ks){
    if(cur&&diff(cur.end,k)<=1){cur.end=k;cur.max=Math.max(cur.max,S.days[k].flow);cur.n++}
    else{cur={start:k,end:k,max:S.days[k].flow,n:1};eps.push(cur)}
  }
  eps.forEach(e=>{
    if(S.mode==='pill'){const pi=packInfo(e.start);
      if(!pi)e.kind='';
      else if(!pi.active||pi.day<=3)e.kind='отмены';
      else e.kind='прорывное';
    }
  });
  return eps;
}
function natural(){
  const eps=episodes().filter(e=>e.max>=2);
  const st=eps.map(e=>e.start);
  const cyc=[];for(let i=1;i<st.length;i++){const c=diff(st[i-1],st[i]);if(c>=15&&c<=60)cyc.push(c)}
  const last=cyc.slice(-6);
  const avg=last.length?Math.round(last.reduce((a,b)=>a+b,0)/last.length):28;
  const lens=eps.slice(-6).map(e=>e.n);
  const len=lens.length?Math.round(lens.reduce((a,b)=>a+b,0)/lens.length):5;
  const lastStart=st[st.length-1]||null;
  let next=lastStart?add(lastStart,avg):null;
  if(next){while(next<add(today(),-len))next=add(next,avg)}
  return{avg,len,next,lastStart,count:cyc.length};
}

/* ---------- рендер ---------- */
let tab='today',calM=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  document.querySelector('nav.tabs').classList.toggle('hide',!S.setup);
  if(!S.setup){$('#app').innerHTML=setupView();bindSetup();return}
  $('#app').innerHTML=`<header><h1><span>☾</span> Луна</h1><div class="row"><button class="icon-btn" id="hlp" aria-label="Подсказки">?</button><button class="icon-btn" id="set" aria-label="Настройки">⚙︎</button></div></header>`+
    (tab==='today'?todayView():tab==='cal'?calView():statsView());
  $('#set').onclick=openSettings;$('#hlp').onclick=()=>openHelp();
  bindView();
}

function ringSVG(pi){
  const len=pi.len,R=104,cx=120,cy=120,gap=len>30?0.6:1.6;
  let s='';const per=360/len;
  for(let i=0;i<len;i++){
    const k=add(pi.start,i),d=i+1,act=d<=P().active;
    const a0=(i*per+gap/2-90)*Math.PI/180,a1=((i+1)*per-gap/2-90)*Math.PI/180;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    let col;const t=today();
    if(!act)col=S.taken[k]?'#7a6575':'#3a2f3a';
    else if(S.taken[k])col='url(#g)';
    else if(k<t&&!(S.since&&k<S.since))col='#ff5a6a';
    else col='#4a2c44';
    const w=k===t?20:14;
    s+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="butt"/>`;
    if(k===t)s+=`<circle cx="${(cx+(R+18)*Math.cos((a0+a1)/2)).toFixed(1)}" cy="${(cy+(R+18)*Math.sin((a0+a1)/2)).toFixed(1)}" r="3.5" fill="#fff"/>`;
  }
  return `<svg viewBox="0 0 240 240"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff6fa8"/><stop offset="1" stop-color="#8e4fd6"/></linearGradient></defs>${s}</svg>`;
}

function todayView(){
  const t=today();let h='';
  if(S.mode==='pill'){
    const pi=packInfo(t);
    if(!pi){return h+`<div class="card"><p>Пачка ещё не начата.</p><button class="btn main" id="newpack">Начала пачку сегодня</button></div>`}
    // предупреждения
    const miss=missedActive();
    if(miss.length){
      h+=`<div class="alert bad"><b>Не отмечена ${miss.length===1?'таблетка':'таблетки'}: ${miss.map(k=>'день '+packInfo(k).day+' ('+fmtShort(k)+')').join(', ')}</b>Если выпила и просто забыла отметить - отметь. Если правда пропустила - глянь, что делать.<div class="row"><button class="btn small" data-mark="${miss[miss.length-1]}">Выпила, отметить</button><button class="btn small" data-help="miss">Что делать при пропуске</button></div></div>`;
    }
    const now=new Date(),sch=schedAt(t),hrs=(now-sch)/36e5;
    if(pi.active&&!S.taken[t]){
      if(hrs>=12)h+=`<div class="alert bad"><b>Опоздание больше 12 часов</b>Выпей сейчас и глянь правила пропуска.<div class="row"><button class="btn small" data-help="miss">Что делать</button></div></div>`;
      else if(hrs>=0)h+=`<div class="alert warn"><b>Пора выпить таблетку 💊</b>Время приёма было в ${P().time}. До 12 часов опоздания - не страшно.</div>`;
    }
    if(P().stock!==null&&P().stock<=0&&diff(t,pi.end)<=7)h+=`<div class="alert info"><b>Запас пачек закончился</b>Новая пачка нужна ${fmt(add(pi.end,1))}. Пора докупить ${esc(P().name)}.</div>`;
    // кольцо
    const tk=S.taken[t];let phase,btn;
    if(pi.active){phase='активная таблетка'}
    else if(P().type==='placebo'){phase='плацебо (пустышка)'}
    else{phase='перерыв'}
    if(!pi.active&&P().type==='break'){btn=`<div class="mut sm" style="text-align:center">Сегодня таблетку не пьём. Новая пачка - ${fmtW(add(pi.end,1))}</div>`}
    else if(tk){const lh=lateH(t);btn=`<button class="btn done" data-unmark="${t}">✓ Выпила в ${new Date(tk.at).toTimeString().slice(0,5)}${lh>=12?' (опоздание)':''}</button><div class="dim sm">нажми, чтобы отменить</div>`}
    else btn=`<button class="btn main" data-mark="${t}">Выпила 💊</button>${!pi.active?'<div class="dim sm">пустышку тоже лучше пить - так не собьёшься</div>':''}`;
    h+=`<div class="card ring-box"><div class="ring">${ringSVG(pi)}<div class="c"><div class="big">${pi.day}</div><div class="of">из ${pi.len}</div><div class="ph">${phase}</div></div></div>${btn}</div>`;
    // инфо
    const nb=nextBleedStart(t),np=add(pi.end,1);
    h+=`<div class="card">`;
    const bleedNow=predBleed(t);
    h+=`<div class="kv"><span class="k">Кровотечение отмены</span><span class="v">${P().inactive<1?'не ожидается (без перерыва)':bleedNow?'ожидается сейчас':nb?'~ с '+fmt(nb):'-'}</span></div>`;
    if(P().inactive>0&&pi.active)h+=`<div class="kv"><span class="k">Последняя активная</span><span class="v">${fmtW(add(pi.start,P().active-1))}</span></div>`;
    h+=`<div class="kv"><span class="k">Новая пачка</span><span class="v">${fmtW(np)}</span></div>`;
    if(P().stock!==null)h+=`<div class="kv"><span class="k">В запасе</span><span class="v">${P().stock} ${plural(P().stock,'пачка','пачки','пачек')}</span></div>`;
    h+=`<div class="kv"><span class="k">${esc(P().name)}</span><span class="v">в ${P().time}</span></div>`;
    h+=`</div>`;
  }else{
    const n=natural();
    h+=`<div class="card ring-box" style="text-align:center">`;
    if(!n.lastStart)h+=`<p class="mut">Отметь первый день месячных в календаре или ниже - и я начну считать.</p>`;
    else{
      const dIn=diff(n.lastStart,t)+1;const toNext=n.next?diff(t,n.next):null;
      h+=`<div class="mut sm">день цикла</div><div style="font-size:56px;font-weight:800;line-height:1.1">${dIn}</div>`;
      h+=`<div>${toNext>0?'месячные примерно через '+toNext+' '+plural(toNext,'день','дня','дней')+' - '+fmt(n.next):toNext!==null&&toNext>-n.len?'месячные ожидаются сейчас':'-'}</div>`;
      h+=`<div class="dim sm">средний цикл ${n.avg} ${plural(n.avg,'день','дня','дней')}${n.count<2?' (пока мало данных, беру 28)':''}</div>`;
    }
    h+=`</div>`;
  }
  // быстрый ввод
  const dd=S.days[t]||{};
  h+=`<div class="card"><h3>Сегодня</h3><div class="chips">${FLOW.map((f,i)=>`<button class="chip flow-${i} ${(dd.flow||0)===i?'on':''}" data-flow="${i}">${i?'🩸 ':''}${f}</button>`).join('')}</div>
  <div class="row" style="margin-top:10px"><button class="btn small" data-day="${t}">Самочувствие и заметка${(dd.sym&&dd.sym.length)||dd.note?' ✎':''}</button></div></div>`;
  return h;
}

function calView(){
  const t=today();if(!calM)calM=t.slice(0,7);
  const[y,m]=calM.split('-').map(Number);
  const first=new Date(y,m-1,1);const off=(first.getDay()+6)%7;
  const start=add(key(first),-off);
  let h=`<div class="card"><div class="cal-head"><button class="icon-btn" id="pm">‹</button><b>${MONN[m-1]} ${y}</b><button class="icon-btn" id="nm">›</button></div><div class="grid">`;
  h+=['пн','вт','ср','чт','пт','сб','вс'].map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<42;i++){
    const k=add(start,i),d=parse(k),dd=S.days[k]||{};
    if(i===35&&d.getMonth()!==m-1)break;
    let cls='d';if(d.getMonth()!==m-1)cls+=' out';if(k===t)cls+=' today';
    if(dd.flow)cls+=' f'+dd.flow;else if(predBleed(k)&&k>=t)cls+=' pred';
    let mk='';
    if(S.mode==='pill'){const pi=packInfo(k);
      if(pi){if(!pi.active){cls+=dd.flow?'':' inact';mk=P().type==='placebo'?(S.taken[k]?'<span class="mk pl">●</span>':'<span class="mk pl">○</span>'):''}
        else if(S.taken[k])mk=lateH(k)>=12?'<span class="mk miss">!</span>':'<span class="mk ok">●</span>';
        else if(k<t&&!(S.since&&k<S.since))mk='<span class="mk miss">✕</span>';
        else mk='<span class="mk dim">·</span>';
        if(pi.day===1)mk+='';
      }
    }
    const sy=(dd.sym&&dd.sym.length)||dd.note?'<span class="sy"></span>':'';
    h+=`<button class="${cls}" data-day="${k}">${d.getDate()}${mk}${sy}</button>`;
  }
  h+=`</div><div class="legend">`;
  if(S.mode==='pill')h+=`<span><b style="color:var(--ok)">●</b> выпила</span><span><b style="color:var(--bad)">✕</b> пропуск</span><span><b style="color:var(--bad)">!</b> опоздание 12ч+</span><span><i style="background:#1a161c;border:1px solid var(--line)"></i>${P().type==='placebo'?'плацебо':'перерыв'}</span>`;
  h+=`<span><i style="background:#7a1f43"></i>кровотечение</span><span><i style="border:1.5px dashed var(--rose)"></i>прогноз</span><span><i style="background:var(--warn);width:6px;height:6px;border-radius:50%"></i> заметка</span></div></div>`;
  h+=`<div class="dim sm" style="text-align:center">Нажми на день, чтобы отметить</div>`;
  return h;
}

function statsView(){
  const eps=episodes().slice().reverse();let h='';
  if(S.mode==='pill'){
    // приём за последние 3 пачки
    const t=today();let exp=0,ok=0,late=0;
    const from=add(t,-L()*3);
    for(let k=from;k<t;k=add(k,1)){if(S.since&&k<S.since)continue;const pi=packInfo(k);if(!pi||!pi.active)continue;exp++;if(S.taken[k]){ok++;if(lateH(k)>=12)late++}}
    const wd=eps.filter(e=>e.kind==='отмены'),br=eps.filter(e=>e.kind==='прорывное');
    const avgLen=wd.length?(wd.slice(0,6).reduce((a,e)=>a+e.n,0)/Math.min(6,wd.length)).toFixed(1):'-';
    h+=`<div class="card"><h3>Последние 3 пачки</h3><div class="stat">
      <div><b>${exp?Math.round(ok/exp*100)+'%':'-'}</b><span>активных таблеток выпито</span></div>
      <div><b>${exp-ok}</b><span>${plural(exp-ok,'пропуск','пропуска','пропусков')}</span></div>
      <div><b>${late}</b><span>опозданий больше 12 ч</span></div>
      <div><b>${avgLen}</b><span>дней длится кровотечение отмены (в среднем)</span></div>
    </div>${br.length?`<p class="sm" style="margin:12px 0 0">Прорывных кровотечений: <b>${br.length}</b>. Если они повторяются несколько пачек подряд - это повод показать историю гинекологу.</p>`:''}</div>`;
  }else{
    const n=natural();
    h+=`<div class="card"><h3>Цикл</h3><div class="stat"><div><b>${n.avg}</b><span>средний цикл, дней</span></div><div><b>${n.len}</b><span>средняя длина месячных</span></div></div></div>`;
  }
  h+=`<div class="card"><h3>Кровотечения</h3>`;
  if(!eps.length)h+=`<p class="mut sm">Пока ничего не отмечено.</p>`;
  else h+=eps.slice(0,24).map(e=>`<div class="ep"><span>${fmtShort(e.start)}${e.end!==e.start?' - '+fmtShort(e.end):''}${e.kind?`<span class="tag ${e.kind==='прорывное'?'br':''}">${e.kind}</span>`:''}</span><span class="mut">${e.n} ${plural(e.n,'день','дня','дней')} · ${FLOW[e.max]}</span></div>`).join('');
  h+=`</div>`;
  // симптомы
  const cnt={};Object.values(S.days).forEach(d=>(d.sym||[]).forEach(s=>cnt[s]=(cnt[s]||0)+1));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(top.length)h+=`<div class="card"><h3>Чаще всего</h3>${top.map(([s,c])=>`<div class="kv"><span class="k">${esc(s)}</span><span class="v">${c} ${plural(c,'раз','раза','раз')}</span></div>`).join('')}</div>`;
  h+=`<button class="btn full" id="exp2">Показать врачу: сводка за 6 месяцев</button>`;
  return h;
}

/* ---------- обработчики ---------- */
function bindView(){
  document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>markPill(b.dataset.mark));
  document.querySelectorAll('[data-unmark]').forEach(b=>b.onclick=()=>{const k=b.dataset.unmark,old=S.taken[k];delete S.taken[k];save();render();toast('Отметка снята',()=>{S.taken[k]=old;save();render()})});
  document.querySelectorAll('[data-help]').forEach(b=>b.onclick=()=>openHelp(b.dataset.help));
  document.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>{const t=today();S.days[t]=S.days[t]||{};S.days[t].flow=+b.dataset.flow;clean(t);save();render()});
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>openDay(b.dataset.day));
  const np=$('#newpack');if(np)np.onclick=()=>{startPack(today())};
  const pm=$('#pm'),nm=$('#nm');
  if(pm){pm.onclick=()=>{calM=shiftM(calM,-1);render()};nm.onclick=()=>{calM=shiftM(calM,1);render()}}
  const e2=$('#exp2');if(e2)e2.onclick=doctorSummary;
}
function shiftM(ym,n){let[y,m]=ym.split('-').map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}return y+'-'+pad(m)}
function clean(k){const d=S.days[k];if(d&&!d.flow&&!(d.sym&&d.sym.length)&&!d.note)delete S.days[k]}
function markPill(k){
  S.taken[k]={at:new Date().toISOString()};save();
  const lh=lateH(k);render();
  if(packInfo(k)&&packInfo(k).active&&lh>=12)openHelp('miss');
  else toast('Отмечено ✓',()=>{delete S.taken[k];save();render()});
}
function startPack(k){
  P().packs=P().packs.filter(p=>p!==k);P().packs.push(k);P().packs.sort();
  if(P().stock!==null&&P().stock>0)P().stock--;
  save();render();toast('Новая пачка с '+fmt(k));
}

/* ---------- окна ---------- */
function sheet(html,onBind){
  const bg=document.createElement('div');bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;
  document.body.appendChild(bg);
  const sh=bg.firstChild;const close=()=>{bg.remove();render()};
  bg.addEventListener('click',e=>{if(e.target===bg)close()});
  // закрытие свайпом вниз
  let y0=null,dy=0;
  sh.addEventListener('touchstart',e=>{if(sh.scrollTop<=0)y0=e.touches[0].clientY},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy>0)sh.style.transform=`translateY(${dy}px)`},{passive:true});
  sh.addEventListener('touchend',()=>{if(dy>90)close();else sh.style.transform='';y0=null;dy=0});
  onBind&&onBind(sh,close);return close;
}
function openDay(k){
  const dd=Object.assign({flow:0,sym:[],note:''},S.days[k]||{});dd.sym=[...(dd.sym||[])];
  const pi=S.mode==='pill'?packInfo(k):null;
  let pill='';
  if(pi&&!(P().type==='break'&&!pi.active)){
    const tk=S.taken[k];
    pill=`<h4>Таблетка · день ${pi.day} из ${pi.len} ${pi.active?'':'(плацебо)'}</h4><div class="row"><button class="chip ${tk?'on':''}" id="pt">${tk?'✓ выпила':'не отмечена'}</button>${tk?`<input type="time" id="ptm" value="${new Date(tk.at).toTimeString().slice(0,5)}" style="width:auto">`:''}</div>${tk&&lateH(k)>=12&&pi.active?'<div class="sm" style="color:var(--bad);margin-top:6px">Опоздание больше 12 часов</div>':''}`;
  }else if(pi)pill=`<h4>День ${pi.day} из ${pi.len} - перерыв</h4>`;
  const html=`<h2>${fmtW(k)}</h2>${pill}
  <h4>Кровотечение</h4><div class="chips" id="fl">${FLOW.map((f,i)=>`<button class="chip flow-${i} ${dd.flow===i?'on':''}" data-f="${i}">${f}</button>`).join('')}</div>
  <h4>Самочувствие</h4><div class="chips" id="sy">${SYM.map(s=>`<button class="chip ${dd.sym.includes(s)?'on':''}" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>
  <h4>Заметка</h4><textarea id="nt" placeholder="например: живот болел с утра, выпила нурофен">${esc(dd.note||'')}</textarea>
  ${S.mode==='pill'?`<div class="row" style="margin-top:12px"><button class="btn small" id="np">С этого дня начала новую пачку</button></div>`:''}
  <button class="btn main" id="ok" style="margin-top:16px">Готово</button>`;
  sheet(html,(sh,close)=>{
    sh.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{dd.flow=+b.dataset.f;sh.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b))});
    sh.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const s=b.dataset.s;const i=dd.sym.indexOf(s);i<0?dd.sym.push(s):dd.sym.splice(i,1);b.classList.toggle('on')});
    const pt=sh.querySelector('#pt');
    if(pt)pt.onclick=()=>{if(S.taken[k])delete S.taken[k];else{const at=schedAt(k);const now=new Date();S.taken[k]={at:(k===today()?now:at).toISOString()}}save();close();openDay(k)};
    const ptm=sh.querySelector('#ptm');
    if(ptm)ptm.onchange=()=>{const[h,m]=ptm.value.split(':').map(Number);const old=new Date(S.taken[k].at);const d=parse(k);d.setHours(h,m,0,0);if(old.getDate()!==d.getDate()&&old>d&&h<12)d.setDate(d.getDate()+1);S.taken[k]={at:d.toISOString()};save()};
    const np=sh.querySelector('#np');if(np)np.onclick=()=>{close();startPack(k)};
    sh.querySelector('#ok').onclick=()=>{dd.note=sh.querySelector('#nt').value.trim();S.days[k]={flow:dd.flow,sym:dd.sym,note:dd.note};clean(k);save();close()};
  });
}

function openHelp(which){
  const miss=`<h2>Если пропустила таблетку</h2><div class="help">
  <p><b>Главное - открой инструкцию именно к своей пачке</b>: правила у разных КОК немного отличаются. Ниже - общая схема для большинства комбинированных таблеток.</p>
  <p><b>Опоздание меньше 12 часов</b> - выпей, как только вспомнила, следующую - в обычное время. Защита сохраняется.</p>
  <p><b>Опоздание больше 12 часов</b> - выпей последнюю пропущенную сразу, даже если это 2 таблетки в один день. Дальше - как обычно. Следующие 7 дней нужна дополнительная защита (презерватив). Что ещё делать, зависит от недели:</p>
  <ul><li><b>1-я неделя</b> (дни 1-7): если в предыдущие 7 дней был секс без презерватива - есть риск беременности, лучше написать гинекологу.</li>
  <li><b>2-я неделя</b> (дни 8-14): если до этого 7 дней пила без пропусков, обычно доп. защита не нужна.</li>
  <li><b>3-я неделя</b> (дни 15-21): часто советуют не делать перерыв / не пить плацебо, а сразу начать новую пачку. Сверься с инструкцией.</li></ul>
  <p><b>Пропустила плацебо</b> - не страшно, просто выбрось пропущенную и продолжай.</p>
  <p><b>Рвота или сильный понос в первые 3-4 часа после таблетки</b> - считается, как будто таблетку не выпила.</p>
  <p class="dim">Это не замена врачу. Если сомневаешься - звони/пиши гинекологу.</p></div>`;
  const gen=`<h2>Как пользоваться</h2><div class="help">
  <p>💊 <b>Каждый вечер</b> жми "Выпила" на главной. Кольцо показывает всю пачку: розовым - выпитые, красным - пропуски, серым - ${P().type==='break'?'перерыв':'плацебо'}.</p>
  <p>🩸 <b>Кровотечение</b> отмечай на главной (сегодня) или в календаре (любой день). Приложение само поймёт, где кровотечение отмены, а где прорывное.</p>
  <p>📦 <b>Новая пачка</b> начинается сама после последней таблетки. Если начала раньше или позже - открой этот день в календаре и нажми "С этого дня начала новую пачку".</p>
  <p>⏰ <b>Напоминание.</b> Браузерные приложения не умеют надёжно будить телефон, поэтому поставь обычный будильник на ${P().time} с подписью "таблетка". Если откроешь приложение после этого времени и не отметишь - оно напомнит.</p>
  <p>🔒 <b>Данные</b> хранятся только на этом телефоне, никуда не отправляются. Делай иногда копию в настройках.</p>
  <p>Почему нет "овуляции" и "фертильных дней": на КОК овуляции нет, и такие прогнозы только путают.</p>
  <button class="btn full" id="tomiss" style="margin-top:8px">Что делать при пропуске</button></div>`;
  sheet(which==='miss'?miss:gen,(sh,close)=>{const b=sh.querySelector('#tomiss');if(b)b.onclick=()=>{close();openHelp('miss')}});

  const html=`<h2>Настройки</h2>

  <details style="margin-top:8px"><summary class="dim sm">Вставить копию текстом</summary><textarea id="imt" placeholder="вставь сюда скопированную копию"></textarea><button class="btn small" id="imtb" style="margin-top:6px">Загрузить из текста</button></details>

        const sv=sh.querySelector('#pk').value;p.stock=sv===''?null:Math.max(0,+sv);
      }
      save();close();toast('Сохранено');
    };
  });
}

function setupView(){
  return `<header><h1><span>☾</span> Луна</h1></header>
  <div class="card"><h2 style="margin:0 0 6px">Привет!</h2><p class="mut" style="margin:0 0 14px">Пара вопросов - и можно пользоваться. Всё хранится только на этом телефоне.</p>
  <div class="seg" id="mode"><button data-m="pill" class="on">Пью КОК</button><button data-m="natural">Без таблеток</button></div>
  <div id="sp">
    <label class="f">Какие таблетки?</label><input id="pn" value="Ярина Плюс">
    <label class="f">Схема</label><select id="ps">${PRESETS.map(x=>`<option value="${x.id}">${x.name} - ${x.hint}</option>`).join('')}</select>
    <label class="f">Во сколько пьёшь?</label><input id="pt" type="time" value="21:00">
    <label class="f">Какую по счёту таблетку пьёшь сегодня?</label><input id="pd" type="number" min="1" max="28" value="1">
    <div class="dim sm" style="margin-top:4px">Посмотри на пачку: номер сегодняшней (даже если ещё не выпила)</div>
    <label class="row" style="margin-top:12px;gap:10px;font-size:15px"><input type="checkbox" id="prev" checked style="width:20px;height:20px"> Предыдущие таблетки этой пачки выпиты</label>
  </div>
  <div id="sn" class="hide">
    <label class="f">Когда начались последние месячные?</label><input id="ls" type="date" value="${today()}">
    <label class="f">Сколько дней длились?</label><input id="ll" type="number" min="1" max="12" value="5">
  </div>
  <button class="btn main" id="go" style="margin-top:18px">Начать</button></div>`;
}
function bindSetup(){
  let mode='pill';
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));$('#sp').classList.toggle('hide',mode!=='pill');$('#sn').classList.toggle('hide',mode==='pill')});
  $('#go').onclick=()=>{
    S.mode=mode;
    if(mode==='pill'){const p=P();p.name=$('#pn').value.trim()||'КОК';const x=PRESETS.find(z=>z.id===$('#ps').value);Object.assign(p,{preset:x.id,active:x.active,inactive:x.inactive,type:x.type});p.time=$('#pt').value||'21:00';
      const day=Math.min(L(),Math.max(1,+$('#pd').value||1));p.packs=[add(today(),-(day-1))];if($('#prev').checked)for(let i=1;i<day;i++){const k=add(today(),-i);if(packInfo(k).active||P().type==='placebo')S.taken[k]={at:schedAt(k).toISOString()}}}
    else{const ls=$('#ls').value,ll=+$('#ll').value||5;if(ls)for(let i=0;i<ll;i++){const k=add(ls,i);if(k<=today())S.days[k]={flow:i<2?3:2,sym:[],note:''}}}
    S.setup=true;S.since=today();save();render();
  };
}

/* ---------- копии и сводка ---------- */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportData(){download('luna-'+today()+'.json',JSON.stringify(S,null,1),'application/json');toast('Копия скачана')}
function loadText(txt,close){try{const o=JSON.parse(txt);if(!o||!o.pill||!o.days)throw 0;S=Object.assign(def(),o,{pill:Object.assign(def().pill,o.pill)});save();close();toast('Копия загружена')}catch(e){toast('Это не похоже на копию Луны')}}
function importData(f,close){if(!f)return;const r=new FileReader();r.onload=()=>loadText(r.result,close);r.readAsText(f)}
function doctorSummary(){
  const from=add(today(),-183);const eps=episodes().filter(e=>e.end>=from);
  let t='Сводка за 6 месяцев ('+fmt(from)+' - '+fmt(today())+')\n';
  if(S.mode==='pill'){let exp=0,ok=0,late=0;for(let k=from;k<today();k=add(k,1)){if(S.since&&k<S.since)continue;const pi=packInfo(k);if(!pi||!pi.active)continue;exp++;if(S.taken[k]){ok++;if(lateH(k)>=12)late++}}
    t+='Препарат: '+P().name+', схема '+P().active+'+'+P().inactive+(P().inactive?(P().type==='placebo'?' плацебо':' перерыв'):'')+', приём в '+P().time+'\n';
    if(exp)t+='Активных таблеток выпито: '+ok+' из '+exp+', пропусков: '+(exp-ok)+', опозданий >12 ч: '+late+'\n';}
  t+='\nКровотечения:\n';
  eps.forEach(e=>{t+='- '+fmtShort(e.start)+(e.end!==e.start?'-'+fmtShort(e.end):'')+': '+e.n+' дн., максимум "'+FLOW[e.max]+'"'+(e.kind?' ('+e.kind+')':'')+'\n'});
  if(!eps.length)t+='не отмечено\n';
  const cnt={};Object.entries(S.days).forEach(([k,d])=>{if(k>=from)(d.sym||[]).forEach(s=>cnt[s]=(cnt[s]||0)+1)});
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  if(top.length)t+='\nСимптомы: '+top.map(([s,c])=>s.toLowerCase()+' - '+c).join(', ')+'\n';
  const notes=Object.entries(S.days).filter(([k,d])=>k>=from&&d.note).sort();
  if(notes.length)t+='\nЗаметки:\n'+notes.map(([k,d])=>'- '+fmtShort(k)+': '+d.note).join('\n')+'\n';
  const done=()=>toast('Сводка скопирована - вставь в сообщение врачу');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>download('luna-svodka.txt',t,'text/plain'));
  else download('luna-svodka.txt',t,'text/plain');
}

/* ---------- мелочи ---------- */
let toastT;
function toast(msg,undo){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>Вернуть</button>':''}`;document.body.appendChild(d);if(undo)d.querySelector('button').onclick=()=>{d.remove();undo()};clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),4000)}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab==='cal')calM=today().slice(0,7);render();scrollTo(0,0)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
setInterval(()=>{if(!document.querySelector('.sheet-bg'))render()},60000);
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
